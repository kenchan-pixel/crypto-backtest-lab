name: ETH forward live-source contract
on:
  workflow_dispatch:
  push:
    branches: ['research/payoff-aware-20260920']
    paths:
      - '.github/workflows/eth-forward-source-contract.yml'
      - 'forward_paper/live_sources.py'
      - 'forward_paper/freshness.py'
      - 'forward_paper/test_live_sources.py'
      - 'forward_paper/test_freshness.py'
      - 'forward_paper/inputs/live_derivative_schema_probe_20260921.json'
      - 'forward_paper/inputs/derivative_freshness_probe_20260922T0117HKT.json'
permissions:
  contents: read
concurrency:
  group: eth-forward-live-source-contract
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'kenchan-pixel/crypto-backtest-lab' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded validation dependencies
        run: python -m pip install pandas==2.2.3 pytest==9.0.2
      - name: Validate source contracts, derivative freshness and fresh read-only spot pair
        run: |
          set -euo pipefail
          python -m pytest -q forward_paper/test_live_sources.py forward_paper/test_freshness.py
          python - <<'PY'
          import datetime,hashlib,json,urllib.request,os
          from pathlib import Path
          from forward_paper.live_sources import normalize_spot_pair
          from forward_paper.freshness import validate_derivative_freshness

          contract_path=Path('forward_paper/inputs/live_derivative_schema_probe_20260921.json')
          derivative_contract=json.loads(contract_path.read_text())
          assert derivative_contract['symbol']=='ETHUSDT'
          assert derivative_contract['frozen_archive_contract']['native_metrics_cadence']=='5m'
          assert derivative_contract['not_yet_proven']

          freshness_path=Path('forward_paper/inputs/derivative_freshness_probe_20260922T0117HKT.json')
          freshness_probe=json.loads(freshness_path.read_text())
          derivative_freshness=validate_derivative_freshness(
            symbol=freshness_probe['symbol'],observed_at=freshness_probe['observed_at_utc'],
            open_interest=freshness_probe['open_interest'],top_accounts=freshness_probe['top_accounts'],
            top_positions=freshness_probe['top_positions'],all_accounts=freshness_probe['all_accounts'],
            taker=freshness_probe['taker'],funding=freshness_probe['funding'])
          assert derivative_freshness['fresh'] is True

          raw={};decoded={}
          for symbol in ['ETHUSDT','BTCUSDT']:
            url=f'https://data-api.binance.vision/api/v3/klines?symbol={symbol}&interval=1h&limit=1000'
            req=urllib.request.Request(url,headers={'User-Agent':'crypto-backtest-lab-forward-paper/1'})
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read();status=r.status
            assert status==200
            raw[symbol]=body
            decoded[symbol]=json.loads(body)
          observed=datetime.datetime.now(datetime.timezone.utc)
          eth,btc=normalize_spot_pair(decoded['ETHUSDT'],decoded['BTCUSDT'],observed,min_completed_hours=721)
          assert eth.index.equals(btc.index)
          ret30=float(eth.close.iloc[-1]/eth.close.iloc[-721]-1)
          receipt={
            'schema':'eth-forward-source-contract-receipt-v3',
            'derivative_connected_probe_sha256':hashlib.sha256(contract_path.read_bytes()).hexdigest(),
            'derivative_freshness_probe_sha256':hashlib.sha256(freshness_path.read_bytes()).hexdigest(),
            'source_contract_tests_passed':True,
            'derivative_freshness_snapshot':derivative_freshness,
            'live_spot_pair_checked':True,
            'spot_symbols':['ETHUSDT','BTCUSDT'],
            'spot_response_sha256':{s:hashlib.sha256(raw[s]).hexdigest() for s in raw},
            'completed_aligned_hours':len(eth),
            'latest_complete_utc':eth.index[-1].isoformat(),
            'eth_latest_complete_age_minutes':eth.attrs['latest_complete_age_minutes'],
            'btc_latest_complete_age_minutes':btc.attrs['latest_complete_age_minutes'],
            'partial_rows_excluded':{'ETHUSDT':eth.attrs['partial_rows_excluded'],'BTCUSDT':btc.attrs['partial_rows_excluded']},
            'eth_30d_return_observation':ret30,
            'observed_at_utc':observed.isoformat(),
            'forward_execution_ready':False,
            'paper_trades_executed':0,
            'does_not_promote_source_freshness_gate':True,
            'remaining_before_source_freshness_gate':['repeat derivative freshness on a later independent collection','macro first-seen capture','complete opportunity-stream parity'],
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID']
          }
          Path('source_contract_receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eth-forward-live-source-contract
          path: source_contract_receipt.json
          retention-days: 14
