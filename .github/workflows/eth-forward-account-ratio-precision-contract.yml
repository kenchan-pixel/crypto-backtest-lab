name: ETH account ratio precision contract
on:
  workflow_dispatch:
  push:
    branches: ['research/payoff-aware-20260920']
    paths:
      - '.github/workflows/eth-forward-account-ratio-precision-contract.yml'
      - 'forward_paper/account_ratio_precision_contract.py'
      - 'forward_paper/test_account_ratio_precision_contract.py'
      - 'forward_paper/inputs/connected_ratio_semantic_probe_20260922T093207Z.json'
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'kenchan-pixel/crypto-backtest-lab' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r forward_paper/requirements.txt
      - name: Run complete forward-paper tests
        run: python -m pytest forward_paper -q
      - name: Validate account ratio precision contract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p forward_validation
          python -m forward_paper.account_ratio_precision_contract \
            --base-dir forward_paper/inputs/connected_binance_full_20260922T072853HKT \
            --connector-probe forward_paper/inputs/connected_ratio_semantic_probe_20260922T093207Z.json \
            --out forward_validation/account_ratio_precision_contract.json \
            | tee forward_validation/diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-forward-account-ratio-precision-contract
          path: forward_validation/
          retention-days: 14
