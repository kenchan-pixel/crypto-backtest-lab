name: Longbridge macro incremental research
on:
  workflow_dispatch:
  push:
    branches: ['research/longbridge-macro-20260920']
    paths: ['macrostudy/**', 'longbridge_macro/**', '.github/workflows/longbridge-macro.yml']
permissions:
  contents: read
concurrency:
  group: longbridge-macro-20260920
  cancel-in-progress: false
jobs:
  research:
    if: github.event.repository.private == false && github.repository == 'kenchan-pixel/crypto-backtest-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r derivatives/requirements.txt
      - name: Unit and causal-timing tests
        run: |
          set -euo pipefail
          mkdir -p verification
          python -m pytest -q macrostudy/test_macro.py derivatives/test_increment.py multifactor/test_research.py | tee verification/unit_tests.txt
      - name: Restore exact prior durable inputs
        run: python -m macrostudy.prepare
      - name: Run frozen macro-surprise experiment
        run: |
          set -euo pipefail
          python -u -m macrostudy.study | tee verification/model_run.log
      - name: Package compact reproducible evidence
        run: python -m macrostudy.package
      - name: Publish versioned research prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m macrostudy.publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longbridge-macro-research-20260920
          path: |
            macro_delivery/
            macro_outputs/
            verification/
          retention-days: 3
          compression-level: 6
