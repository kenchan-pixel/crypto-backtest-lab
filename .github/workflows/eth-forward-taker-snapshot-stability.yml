name: ETH taker snapshot stability
on:
  workflow_dispatch:
  push:
    branches: ['research/payoff-aware-20260920']
    paths:
      - '.github/workflows/eth-forward-taker-snapshot-stability.yml'
      - 'forward_paper/taker_snapshot_stability.py'
      - 'forward_paper/test_taker_snapshot_stability.py'
      - 'forward_paper/inputs/connected_taker_requery_20260922T190141HKT.json'
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'kenchan-pixel/crypto-backtest-lab' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r forward_paper/requirements.txt
      - name: Run complete forward-paper tests
        run: python -m pytest forward_paper -q
      - name: Validate taker historical snapshot stability
        shell: bash
        run: |
          set -o pipefail
          mkdir -p forward_validation
          python -m forward_paper.taker_snapshot_stability \
            --old forward_paper/inputs/connected_binance_full_20260922T072853HKT/taker.json \
            --requery forward_paper/inputs/connected_taker_requery_20260922T190141HKT.json \
            --out forward_validation/taker_snapshot_stability.json \
            | tee forward_validation/diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-forward-taker-snapshot-stability
          path: forward_validation/
          retention-days: 14
