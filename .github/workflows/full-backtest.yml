name: Full Binance 8-rule backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-backtest.yml'

permissions:
  contents: read

concurrency:
  group: crypto-8-rules-full-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Restore tested source bundle
        run: |
          cat source_bundle.part* > /tmp/source_bundle.b64
          base64 -d /tmp/source_bundle.b64 > /tmp/source_bundle.tar.gz
          tar -xzf /tmp/source_bundle.tar.gz
          rm /tmp/source_bundle.b64 /tmp/source_bundle.tar.gz
          test -f lab/pipeline.py
          test -f tests/test_lab.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Unit and causal-timing tests
        run: python -m pytest -q

      - name: Run frozen full backtest on official Binance archives
        run: |
          mkdir -p logs artifacts
          python -m lab --full 2>&1 | tee logs/full-backtest.log

      - name: Verify completion flag
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          states=[]
          for p in Path('reports').glob('*/execution_status.json'):
              s=json.loads(p.read_text())
              states.append((p,s))
          good=[(p,s) for p,s in states if s.get('full_backtest_executed') is True]
          if not good:
              raise SystemExit('No completed real-data backtest flag found')
          print(good[-1][0])
          PY

      - name: Execute results notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute notebooks/results_report.ipynb \
            --output executed_results_report.ipynb --output-dir artifacts \
            --ExecutePreprocessor.timeout=900

      - name: Package final small outputs
        if: always()
        run: |
          mkdir -p artifacts
          cp -r reports artifacts/reports || true
          cp -r logs artifacts/logs || true
          cp PROTOCOL.md SOURCES.md artifacts/ || true
          find artifacts -type f -size +80M -delete
          du -sh artifacts || true

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-8-rules-backtest-results
          path: artifacts/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
