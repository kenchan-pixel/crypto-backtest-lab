name: Data-driven crypto discovery
on:
  workflow_dispatch:
  push:
    branches: ['research/data-driven-discovery-20260918']
    paths: ['.github/workflows/data-driven-discovery.yml']
permissions:
  contents: read
concurrency:
  group: crypto-data-driven-discovery-20260918
  cancel-in-progress: false
jobs:
  research:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r discovery/requirements.txt
      - name: Unit and causal feature tests
        run: python -m pytest -q discovery/test_discovery.py
      - name: Explore training data only
        run: |
          set -euo pipefail
          mkdir -p discovery_outputs
          python -u -m discovery.explore 2>&1 | tee discovery_outputs/run.log
      - name: Package source and size check
        if: always()
        run: |
          mkdir -p discovery_outputs/reproducible_source
          cp -r discovery discovery_outputs/reproducible_source/
          python -m pip freeze > discovery_outputs/environment.txt
          python - <<'PY'
          from pathlib import Path
          size=sum(p.stat().st_size for p in Path('discovery_outputs').rglob('*') if p.is_file())
          print('Output bytes',size)
          if size>40*1024*1024: raise SystemExit('Output size limit')
          PY
      - name: Save actual research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-driven-discovery-phase1
          path: discovery_outputs/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
