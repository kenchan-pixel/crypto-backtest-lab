name: ETH forward runtime CAS commissioning
on:
  workflow_dispatch:
  push:
    branches: ['research/payoff-aware-20260920']
    paths:
      - '.github/workflows/eth-forward-runtime-store.yml'
      - 'forward_paper/runtime_store.py'
      - 'forward_paper/test_runtime_store.py'
permissions:
  contents: read
concurrency:
  group: eth-forward-runtime-cas
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'kenchan-pixel/crypto-backtest-lab' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r forward_paper/requirements.txt
      - name: Run complete forward-paper tests
        run: |
          set -euo pipefail
          mkdir -p forward_validation
          python -m pytest -q forward_paper | tee forward_validation/tests.txt
      - name: Exercise CAS and restart semantics on isolated current-state copy
        run: |
          set -euo pipefail
          python -m forward_paper.runtime_store \
            --state forward_paper/runtime/state.json \
            --work-dir forward_validation/runtime_store_probe \
            --out forward_validation/runtime_store_receipt.json | tee forward_validation/runtime_store.log
      - name: Enforce commissioning boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('forward_validation/runtime_store_receipt.json'))
          assert r['passed'] is True
          assert all(r['checks'].values())
          assert r['actual_runtime_state_mutated'] is False
          assert r['paper_trades_created']==0 and r['real_orders_created']==0
          assert r['order_account_endpoints_used'] is False
          assert r['source_status']=='COMMISSIONING'
          assert r['source_execution_ready'] is False
          assert r['source_performance_started_at'] is None
          assert r['source_paper_closed_trades']==0
          assert r['gate_effect'].startswith('none;')
          print('CAS/restart foundation validated on an isolated copy; live runtime remains idle and unarmed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-forward-runtime-cas-commissioning
          path: forward_validation/
          retention-days: 14
